<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Chat</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e5e7eb; --user: #2563eb; --user-text: #ffffff; --code: #f3f4f6;
    --accent: #10a37f; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #9aa3af;
      --border: #2a2f3a; --user: #2563eb; --user-text: #ffffff; --code: #0b0d11;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 6px 12px;
  }
  button:hover { border-color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.error { align-self: center; color: var(--danger); background: transparent; font-size: 14px; }
  .msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; }
  .msg code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .msg :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { color: var(--text); font-weight: 600; margin-bottom: 4px; }
  form { padding: 12px 16px 16px; background: var(--bg); }
  .box {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
  }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; max-height: 200px; padding: 6px;
  }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); }
  #send:disabled { opacity: .5; cursor: default; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>GPT Chat</h1>
  <button id="newChat" type="button">New chat</button>
</header>

<main id="chat"><div class="wrap" id="messages">
  <div class="empty" id="empty"><h2>How can I help?</h2><p>Type a message below to start.</p></div>
</div></main>

<form id="form">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Message GPT…  (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), list = $("messages"), input = $("input"), send = $("send");
  let history = [];
  let controller = null;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Tiny, safe markdown: code blocks, inline code, bold. Everything else is plain text.
  function render(text) {
    return escapeHtml(text)
      .split(/```/)
      .map((part, i) => {
        if (i % 2 === 1) return "<pre><code>" + part.replace(/^[\w+-]*\n/, "") + "</code></pre>";
        return part
          .replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      })
      .join("");
  }

  function addBubble(role, text) {
    $("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = role === "assistant" ? render(text) : escapeHtml(text);
    list.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask() {
    const text = input.value.trim();
    if (!text || controller) return;
    input.value = ""; autosize();
    history.push({ role: "user", content: text });
    addBubble("user", text);

    const bubble = addBubble("assistant", "");
    bubble.classList.add("cursor");
    send.textContent = "Stop";
    controller = new AbortController();
    let reply = "";
    let retry = false;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-app-password": store.get("app-password") || "" },
        body: JSON.stringify({ messages: history }),
        signal: controller.signal,
      });

      if (res.status === 401) {
        store.del("app-password");
        const pw = prompt("This site is password-protected. Enter the password:");
        if (!pw) throw new Error("Password required.");
        store.set("app-password", pw);
        bubble.remove(); list.lastChild?.remove(); history.pop();
        input.value = text; retry = true;
        return;
      }
      if (!res.ok) throw new Error(friendlyError(res.status, await res.text()));

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        reply += decoder.decode(value, { stream: true });
        bubble.innerHTML = render(reply);
        chat.scrollTop = chat.scrollHeight;
      }
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      if (err.name === "AbortError") {
        if (reply) history.push({ role: "assistant", content: reply });
      } else {
        if (!reply) bubble.remove();
        addBubble("error", err.message);
        if (history.at(-1)?.role === "user") history.pop();
      }
    } finally {
      bubble.classList.remove("cursor");
      finish();
      if (retry) ask();
    }
  }

  function friendlyError(status, body) {
    let msg = body;
    try { msg = JSON.parse(body).error?.message || body; } catch {}
    if (status === 429) return "OpenAI rate limit or quota reached: " + msg;
    return "Error " + status + ": " + msg;
  }

  function finish() { controller = null; send.textContent = "Send"; input.focus(); }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (controller) controller.abort(); else ask();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!controller) ask(); }
  });
  input.addEventListener("input", autosize);
  $("newChat").addEventListener("click", () => {
    controller?.abort();
    history = [];
    list.innerHTML = '<div class="empty" id="empty"><h2>How can I help?</h2><p>Type a message below to start.</p></div>';
    input.focus();
  });
  input.focus();
</script>
</body>
</html>
